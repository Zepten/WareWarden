server {
    listen 80;
    server_name warewarden;

    # React application
    location / {
        proxy_pass http://react-app-service:5000;  
    }

    # API
    location /api {
        proxy_pass http://api-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}